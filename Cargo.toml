[package]
name = "archprojeteur"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.14.1", default-features = false, features = ["async-io", "screencast"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
futures-lite = "2.6.1"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
